    <title>Cross Dimension Crisis FPS</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060c;
        overflow: hidden;
      }
      body {
        /* スマホで画面がスクロール・拡大しないように */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-user-select: none;
        user-select: none;
      }
      canvas {
        position: absolute;
        display: block;
      }
      /* 3D のフィールド (下) と、HUD・メニュー・文字の 2D (上) を重ねる */
      #gl {
        box-shadow: 0 0 40px rgba(80, 120, 255, 0.25);
      }
